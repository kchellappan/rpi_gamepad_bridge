# Stadia Controller (wired) -> Nintendo Switch
#
# Bindings below were produced by `gpb-discover wizard` against a real Stadia controller,
# not guessed. See the face-button note further down -- it is not a formality.

[bridge]
source = evdev
sink   = ns_hid
rumble = false          # reverse channel exists but is off by default

# Capture for VLA training. Set a path (or pass --record) to enable; each record is one
# 40-byte GamepadState, the identical struct the socket source accepts.
record_path      = 
record_ring_slots = 8192

# Real-time hygiene. Both are optional and both warn rather than fail if not permitted.
rt_priority  = 0        # 1..99 enables SCHED_FIFO; needs CAP_SYS_NICE
cpu_affinity = -1       # pin to an isolated core, e.g. 3

[source.evdev]
# Globs are resolved at startup. by-id paths embed the controller's serial number, so a
# wildcard keeps this config working across units (and across replacing your own).
# `gpb-discover list` prints the exact path if you would rather pin it.
device = /dev/input/by-id/usb-Google_LLC_Stadia_Controller_rev._A_*-if01-event-joystick
grab   = true           # exclusive: stop the Pi's own input stack reacting to the pad

# Axes. A leading '-' inverts. Convention is +X right, +Y down.
# Measured: the Stadia's sticks report min=1 max=255, and EVIOCGABS returns an
# uninitialized 0 until the pad first reports -- which is why ranges are read from the
# kernel rather than assumed.
axis.ABS_X     = lx
axis.ABS_Y     = ly
axis.ABS_Z     = rx
axis.ABS_RZ    = ry
axis.ABS_BRAKE = lt
axis.ABS_GAS   = rt
axis.ABS_HAT0X = hatx
axis.ABS_HAT0Y = haty

# Buttons, named by PHYSICAL POSITION.
#
# Look carefully at these two lines:
#
#     button.BTN_NORTH = west
#     button.BTN_WEST  = north
#
# That is not a typo. In input-event-codes.h, BTN_X aliases BTN_NORTH and BTN_Y aliases
# BTN_WEST -- but on this pad's layout X sits WEST and Y sits NORTH. So the code named
# BTN_NORTH is emitted by a physically western button. Measured on the hardware; reading
# the code names would have produced the opposite and swapped X/Y on the Switch, which
# would have looked like a mapping preference rather than a bug.
button.BTN_SOUTH  = south
button.BTN_EAST   = east
button.BTN_NORTH  = west
button.BTN_WEST   = north
button.BTN_TL     = l1
button.BTN_TR     = r1
button.BTN_THUMBL = l3
button.BTN_THUMBR = r3
button.BTN_SELECT = select
button.BTN_START  = start
button.BTN_MODE   = guide
button.BTN_TRIGGER_HAPPY1 = misc1

[sink.ns_hid]
device = /dev/hidg0

# true  -> preserve physical position: the bottom face button becomes the Switch's bottom
#          face button (B), whatever letter was printed on the source pad.
# false -> preserve the letter: an "A" becomes the Switch's "A", in a different location.
face_by_position = true

# Resend the full state at this rate even when nothing has changed.
#
# This is not optional for a console. A real gamepad transmits its complete state every
# polling interval, so a held button appears in hundreds of consecutive polls. Sending only
# on change means a button press exists in exactly one report, and a host that debounces or
# samples across polls will miss most presses outright.
#
# Observed on a Switch 2 with this at 0: analog sticks tracked perfectly (absolute values
# are correct in whatever report does land), but buttons needed roughly five presses to
# register once, and the console would then treat one as held. Sticks working while buttons
# misbehave is the signature of sparse reporting, not of a mapping error.
#
# 125 Hz matches a conventional USB gamepad. The gadget endpoint polls at 1 ms, so the host
# reads each report about eight times. Raise it toward 1000 if presses are still dropped.
heartbeat_hz = 125

[profile]
trigger_deadzone = 12

[profile.left]
deadzone   = 2000       # radial, on the stick pair -- not per-axis
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false

[profile.right]
deadzone   = 2000
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false
