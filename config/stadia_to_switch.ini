# Stadia Controller (wired) -> Nintendo Switch
#
# ===========================================================================
#  THE AXIS AND BUTTON BINDINGS BELOW ARE UNVERIFIED GUESSES.
#  Generate the real ones on the Pi:   sudo gpb-discover wizard <device>
# ===========================================================================
#
# Why they cannot simply be looked up: evdev's face-button aliases do not mean what they
# appear to. In input-event-codes.h, BTN_X is an alias for BTN_NORTH and BTN_Y is an alias
# for BTN_WEST -- but on an Xbox-layout pad, X sits WEST and Y sits NORTH. So a driver
# faithfully reporting its pad's "X" button emits the code named BTN_NORTH for a button
# that is physically on the west. Any mapping derived by reading code names is a coin flip.
#
# The wizard sidesteps this entirely: it asks you to press the TOP face button and records
# whatever code actually arrives. Measured physical position beats a naming convention.

[bridge]
source = evdev
sink   = ns_hid
rumble = false          # reverse channel exists but is off by default

# Capture for VLA training. Set a path (or pass --record) to enable; each record is one
# 40-byte GamepadState, the identical struct the socket source accepts.
record_path      = 
record_ring_slots = 8192

# Real-time hygiene. Both are optional and both warn rather than fail if not permitted.
rt_priority  = 0        # 1..99 enables SCHED_FIFO; needs CAP_SYS_NICE
cpu_affinity = -1       # pin to an isolated core, e.g. 3

[source.evdev]
# Use the by-id path, not eventN: event numbers are assigned in probe order and move on
# replug. Two details the real device confirmed: the interface suffix is "-if01-", and the
# path embeds your controller's own serial number -- so replace CHANGEME below with yours.
# Print the exact path with:  gpb-discover list
device = /dev/input/by-id/usb-Google_LLC_Stadia_Controller_rev._A_CHANGEME-if01-event-joystick
grab   = true           # exclusive: stop the Pi's own input stack reacting to the pad

# Axes. A leading '-' inverts. Convention is +X right, +Y down.
axis.ABS_X     = lx
axis.ABS_Y     = ly
axis.ABS_Z     = rx
axis.ABS_RZ    = ry
axis.ABS_BRAKE = lt
axis.ABS_GAS   = rt
axis.ABS_HAT0X = hatx
axis.ABS_HAT0Y = haty

# Buttons, named by physical position (see the alias warning above).
button.BTN_SOUTH  = south
button.BTN_EAST   = east
button.BTN_NORTH  = north
button.BTN_WEST   = west
button.BTN_TL     = l1
button.BTN_TR     = r1
button.BTN_THUMBL = l3
button.BTN_THUMBR = r3
button.BTN_SELECT = select
button.BTN_START  = start
button.BTN_MODE   = guide
button.BTN_TRIGGER_HAPPY1 = misc1

[sink.ns_hid]
device = /dev/hidg0

# true  -> preserve physical position: the bottom face button becomes the Switch's bottom
#          face button (B), whatever letter was printed on the source pad.
# false -> preserve the letter: an "A" becomes the Switch's "A", in a different location.
face_by_position = true

# 0 = event-driven only. Set a rate if the host turns out to want traffic even when
# nothing changed; measure before assuming it does.
heartbeat_hz = 0

[profile]
trigger_deadzone = 12

[profile.left]
deadzone   = 2000       # radial, on the stick pair -- not per-axis
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false

[profile.right]
deadzone   = 2000
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false
