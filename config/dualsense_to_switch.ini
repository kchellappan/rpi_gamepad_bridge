# Sony DualSense (PS5, wired) -> Nintendo Switch
#
# Bindings below were produced by the mapping wizard against a real DualSense and verified
# on a Switch 2, not guessed. Worth keeping alongside the Stadia config because the two pads
# disagree in almost every way that matters, which is the best argument for measuring rather
# than assuming.

# Shown in the web control panel. Purely descriptive: nothing reads these but the UI.
[meta]
name = DualSense to Nintendo Switch
description = Wired Sony DualSense (PS5) driving a Switch over USB HID. Mapped by position; no Capture button available.

[bridge]
source = evdev
sink   = ns_hid
rumble = false          # reverse channel exists but is off by default

# Capture for VLA training. Set a path (or pass --record) to enable; each record is one
# 48-byte GamepadState, the identical struct the socket source accepts.
record_path      = 
record_ring_slots = 8192

# Real-time hygiene. Both are optional and both warn rather than fail if not permitted.
rt_priority  = 0        # 1..99 enables SCHED_FIFO; needs CAP_SYS_NICE
cpu_affinity = -1       # pin to an isolated core, e.g. 3

[source.evdev]
# Unlike the Stadia's, this by-id path carries no serial number, so it is portable as
# written. The glob is belt and braces. `gpb-discover list` prints the exact path.
device = /dev/input/by-id/usb-Sony_Interactive_Entertainment_Wireless_Controller*-if03-event-joystick
grab   = true           # exclusive: stop the Pi's own input stack reacting to the pad

# Axes. A leading '-' inverts. Convention is +X right, +Y down.
#
# Two differences from the Stadia worth knowing:
#
#   - The right stick is ABS_RX/ABS_RY here. On the Stadia it is ABS_Z/ABS_RZ, which on this
#     pad are the analog triggers instead. The same code names mean different controls.
#   - The d-pad arrives as a HAT (a single axis pair) rather than four buttons, so it binds
#     as hatx/haty. Binding it as four button targets produces lines the bridge silently
#     drops, and a d-pad that simply does not exist.
axis.ABS_X     = lx
axis.ABS_Y     = ly
axis.ABS_RX    = rx
axis.ABS_RY    = ry
axis.ABS_HAT0X = hatx
axis.ABS_HAT0Y = haty

# Buttons, named by PHYSICAL POSITION.
#
# Compare these two lines with the Stadia config:
#
#     DualSense                  Stadia
#     button.BTN_NORTH = north   button.BTN_NORTH = west
#     button.BTN_WEST  = west    button.BTN_WEST  = north
#
# Both were measured on real hardware. The same two evdev codes describe opposite physical
# positions on the two pads, because hid-playstation and hid-generic disagree about how the
# aliases map. No amount of reading input-event-codes.h tells you which you have; this is
# exactly what the wizard exists to determine.
button.BTN_SOUTH  = south
button.BTN_EAST   = east
button.BTN_NORTH  = north
button.BTN_WEST   = west
button.BTN_TL     = l1
button.BTN_TR     = r1
button.BTN_THUMBL = l3
button.BTN_THUMBR = r3
button.BTN_SELECT = select
button.BTN_START  = start

# ZL/ZR bound DIGITALLY. The DualSense's triggers are analog, but the Switch's ZL/ZR are
# not, so binding the buttons directly is both simpler and exact. The alternative --
# axis.ABS_Z = lt, axis.ABS_RZ = rt -- also works and gives the profile's trigger_deadzone
# something to act on.
button.BTN_TL2    = l2
button.BTN_TR2    = r2

# Deliberately unmapped:
#
#   guide (Home)    -- BTN_MODE exists on this pad; add `button.BTN_MODE = guide` to use it.
#   misc1 (Capture) -- there is nothing left to bind it to. The DualSense's Create button
#                      reports BTN_SELECT, which is already Minus above. A pad can simply
#                      run out of controls, and that is not a mapping error.

[sink.ns_hid]
device = /dev/hidg0

# true  -> preserve physical position: the bottom face button becomes the Switch's bottom
#          face button (B), whatever letter was printed on the source pad.
# false -> preserve the letter instead.
face_by_position = true

# Consoles expect state every polling interval, not only on change. At 0, buttons are mostly
# missed while sticks appear to work perfectly -- sticks are absolute and survive sparse
# reporting, a button press exists in exactly one report.
heartbeat_hz = 125

[profile]
trigger_deadzone = 12

[profile.left]
deadzone   = 2000       # radial, on the stick pair -- not per-axis
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false

[profile.right]
deadzone   = 2000
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false
