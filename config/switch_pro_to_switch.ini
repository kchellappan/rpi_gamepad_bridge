# Nintendo Switch Pro Controller (wired) -> Nintendo Switch
#
# Bindings below were measured with `gpb-discover wizard` (ZL/ZR with `gpb-discover capture`)
# against a real Pro Controller, and match hid-nintendo's own button table, which is the same
# on kernel 6.6 and 7.0. Measured on a Linux laptop, NOT yet on the Pi or against a console:
# the evdev codes come from the kernel driver, so they should carry over, but that is an
# expectation rather than a result.
#
# The Pro Controller can of course talk to a Switch directly. This config exists for the
# cases that want the bridge in the path anyway: capturing a session for training data,
# layering a transform, or driving the console from the same pad an automation replays.
#
# Handled by the kernel's hid-nintendo driver, which exposes TWO input nodes for one pad.
# The glob below matches only the gamepad; see the device note.

# Shown in the web control panel. Purely descriptive: nothing reads these but the UI.
[meta]
name = Pro Controller to Nintendo Switch
description = Wired Nintendo Switch Pro Controller driving a Switch over USB HID. Every control mapped, including Capture.

[bridge]
source = evdev
sink   = ns_hid
rumble = false          # reverse channel exists but is off by default

# Capture for VLA training. Set a path (or pass --record) to enable; each record is one
# 48-byte GamepadState, the identical struct the socket source accepts.
record_path      =
record_ring_slots = 8192

# Real-time hygiene. Both are optional and both warn rather than fail if not permitted.
rt_priority  = 0        # 1..99 enables SCHED_FIFO; needs CAP_SYS_NICE
cpu_affinity = -1       # pin to an isolated core, e.g. 3

[source.evdev]
# hid-nintendo creates a second node for the motion sensors, "Pro Controller (IMU)". Its
# by-id link ends -event-if00 rather than -event-joystick, so this glob cannot pick it --
# which matters, because the IMU node has axes and would open without complaint while
# producing no buttons at all. The serial in the path reads 000000000001 on this unit; the
# wildcard is there in case another unit disagrees.
device = /dev/input/by-id/usb-Nintendo_Co.__Ltd._Pro_Controller_*-event-joystick
grab   = true           # exclusive: stop the Pi's own input stack reacting to the pad

# Axes. A leading '-' inverts. Convention is +X right, +Y down.
#
# hid-nintendo applies the pad's factory stick calibration and reports -32767..32767 with
# +Y already down, so nothing here is inverted. The sticks do not rest at exactly zero --
# a few hundred counts off is normal -- which the profile's deadzone absorbs.
#
# The d-pad is a hat, as on the DualSense. hid-nintendo reports four d-pad buttons for a
# Joy-Con but a hat for the Pro Controller specifically.
axis.ABS_X     = lx
axis.ABS_Y     = ly
axis.ABS_RX    = rx
axis.ABS_RY    = ry
axis.ABS_HAT0X = hatx
axis.ABS_HAT0Y = haty

# Buttons, named by PHYSICAL POSITION.
#
# hid-nintendo assigns codes by the letter printed on the button -- A is BTN_EAST, B is
# BTN_SOUTH, X is BTN_NORTH, Y is BTN_WEST. On a Nintendo layout the letters and the
# compass names happen to agree, so these lines read as the identity. That is a property of
# this pad, not of the codes: the same two lines are swapped on the Stadia.
button.BTN_SOUTH  = south
button.BTN_EAST   = east
button.BTN_NORTH  = north
button.BTN_WEST   = west
button.BTN_TL     = l1
button.BTN_TR     = r1
button.BTN_THUMBL = l3
button.BTN_THUMBR = r3
button.BTN_SELECT = select
button.BTN_START  = start
button.BTN_MODE   = guide

# ZL/ZR are digital on this pad; there is no analog trigger axis to bind instead.
button.BTN_TL2    = l2
button.BTN_TR2    = r2

# Capture arrives as BTN_Z. Unlike the DualSense, this pad has a dedicated control for it.
button.BTN_Z      = misc1

[sink.ns_hid]
device = /dev/hidg0

# Must stay true for this pad.
#
# true  -> preserve physical position: the bottom face button becomes the Switch's B.
# false -> "preserve the letter", which assumes the source pad is lettered like an Xbox pad
#          (A at the bottom). A Nintendo pad is not, so false would turn this pad's B into
#          the Switch's A and swap X with Y -- wrong by both position AND letter.
face_by_position = true

# Consoles expect state every polling interval, not only on change. At 0, buttons are mostly
# missed while sticks appear to work perfectly -- sticks are absolute and survive sparse
# reporting, a button press exists in exactly one report.
heartbeat_hz = 125

[profile]
trigger_deadzone = 12

[profile.left]
deadzone   = 2000       # radial, on the stick pair -- not per-axis
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false

[profile.right]
deadzone   = 2000
saturation = 32000
expo       = 1.0
invert_x   = false
invert_y   = false
