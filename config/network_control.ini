# Driven over the network -> Nintendo Switch
#
# For the topology where the machine running inference is not the Pi. A workstation's USB
# ports are host-only -- no device-side controller -- so it cannot present itself as a
# gamepad no matter what software it runs. The Pi stays in the path and takes instructions
# over Ethernet.
#
# Use wired Ethernet, ideally a direct cable. WiFi adds milliseconds and jitter that would
# dominate a budget otherwise set by a 1 ms USB polling interval.

[meta]
name = Network control
description = Controller state arrives over UDP from another machine; capture is published back for alignment with video.

[bridge]
source = udp
sink   = ns_hid

# Publish every state to the controlling machine as it happens.
#
# The alternative -- recording to a file here -- is fine when the Pi is the only
# participant. It is not, when a second machine is capturing HDMI video for the same
# session: correlating a file on the Pi against frames on the rig means reconciling two
# clocks afterwards. Publishing lets the consumer timestamp both streams against one.
publish_host = 192.168.1.100
publish_port = 9872
publish_key  = change-me

[source.udp]
bind = 0.0.0.0
port = 9871

# Accept datagrams only from this address. On a direct cable this is most of the security
# you need; on a shared LAN it is not sufficient on its own, which is what the key is for.
peer = 192.168.1.100

# A gap longer than this means the client's stream ended, so the next datagram begins a new
# session and its sequence numbering starts fresh. Without it, a restarted client -- which
# begins counting at 1 again -- would look permanently stale and be ignored silently.
session_gap_ms = 1000

# HMAC-SHA256 over each datagram. Without it, anything that can reach this port can drive
# the gamepad -- and this port is wired to a console.
key = change-me

[sink.ns_hid]
device = /dev/hidg0
face_by_position = true

# Consoles expect state every polling interval, not only on change.
heartbeat_hz = 125

[profile]
trigger_deadzone = 12

# The client sends canonical action space, so the mapping layer is skipped for it entirely.
# These are here for completeness rather than effect.
[profile.left]
deadzone   = 0
saturation = 32767
expo       = 1.0

[profile.right]
deadzone   = 0
saturation = 32767
expo       = 1.0
