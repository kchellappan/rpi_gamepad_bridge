name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler versions
        run: g++ --version && cmake --version

      - name: Build
        run: ./scripts/build.sh

      # The suite runs without a Pi, a gadget or a controller: SocketSource stands in for a
      # controller and a regular file stands in for /dev/hidg0. The uinput-backed evdev test
      # skips rather than fails where /dev/uinput is unavailable.
      - name: Load uinput for the evdev test
        run: sudo modprobe uinput || echo "uinput unavailable; that test will skip"

      - name: Test
        run: ./tests/run_tests.sh

  build-without-cmake:
    name: Build via g++ fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/build.sh falls back to invoking g++ directly when cmake is absent. That path
      # is load-bearing rather than decorative -- it is what allows a build on a freshly
      # flashed Raspberry Pi OS image, which ships a compiler but no cmake -- so it needs to
      # keep working. Masking cmake is the only way to exercise it on a runner that has one.
      - name: Build with the cmake path disabled
        run: |
          USE_CMAKE=0 ./scripts/build.sh 2>&1 | tee out.log
          grep -q "falling back to direct g++" out.log
          test -x build/gpbridge && test -x build/gpb-discover && test -x build/gpb-fakepad

  shell-scripts:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        run: |
          fail=0
          for f in scripts/*.sh tests/*.sh; do
            if bash -n "$f"; then echo "  ok    $f"; else echo "  FAIL  $f"; fail=1; fi
          done
          exit $fail
